name: OVSITE One-Time Settings Security Cleanup

on:
  push:
    branches:
      - chore/ovsite-production-hardening

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/ovsite-production-hardening

      - name: Remove false client-side security controls
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/SettingsPage.tsx')
          s = p.read_text()

          s = s.replace('  ShieldCheck, Lock, Activity, Shield, Database, Trash2,\n', '  ShieldCheck, Activity, Shield, Database, Trash2,\n')
          s = s.replace("    if (newPass.length < 8) { setResult({ ok: false, msg: 'New password must be at least 8 characters.' }); return; }", "    if (newPass.length < 12) { setResult({ ok: false, msg: 'New password must be at least 12 characters.' }); return; }")
          s = s.replace("        setResult({ ok: true, msg: 'Password updated successfully.' });\n        setCurrent(''); setNewPass(''); setConfirm('');", "        setResult({ ok: true, msg: 'Password changed. Signing out…' });\n        setCurrent(''); setNewPass(''); setConfirm('');\n        window.setTimeout(() => onSignOut(), 600);")
          s = s.replace("  const [pin, setPin] = useState('');\n  const [pinUnlocked, setPinUnlocked] = useState(false);\n  const [pinError, setPinError] = useState(false);\n", '')

          start = s.find('  const handlePinSubmit = () => {')
          end = s.find('  const sections = [', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate client-side PIN gate block')
          s = s[:start] + s[end:]

          lock_button = '''          <button onClick={() => setPinUnlocked(false)} className="px-6 py-2.5 hc-clay-raised text-[9px] font-black uppercase tracking-widest text-hc-teal border border-hc-teal/20 hover:bg-hc-teal/5 transition-all active:hc-clay-pressed flex items-center gap-2 rounded-xl">\n            <Lock size={12} />\n            Lock\n          </button>\n'''
          s = s.replace(lock_button, '')
          s = s.replace("{ id: 'session' as Section, label: 'Hardware', icon: <ShieldAlert size={14} /> }", "{ id: 'session' as Section, label: 'Device', icon: <ShieldAlert size={14} /> }")
          s = s.replace("<p className=\"text-[10px] font-bold text-hc-muted uppercase tracking-widest opacity-60\">This node's hardware fingerprint</p>", "<p className=\"text-[10px] font-bold text-hc-muted uppercase tracking-widest opacity-60\">Local browser installation identifier</p>")
          s = s.replace("<span className=\"text-[10px] font-black text-hc-muted uppercase tracking-widest\">Auth Level</span>\n                  <span className=\"text-[11px] font-black text-hc-teal uppercase tracking-widest\">Admin</span>", "<span className=\"text-[10px] font-black text-hc-muted uppercase tracking-widest\">Session</span>\n                  <span className=\"text-[11px] font-black text-hc-teal uppercase tracking-widest\">Authenticated</span>")
          s = s.replace('Hardware Burn', 'Local Device Reset')
          s = s.replace('Hold 2s to Initiate Burn', 'Hold 2s to Reset Local Data')
          s = s.replace('FULL LOCAL RESET: This will wipe all OVSITE data on this device. Proceed?', 'LOCAL DEVICE RESET: This will wipe OVSITE data stored in this browser. Proceed?')
          s = s.replace('Immediate destructive clear of all local care records, credentials, and session metadata on this device.', 'Immediate destructive clear of OVSITE records and settings stored locally in this browser. Server-side credentials are not changed.')
          s = s.replace("hash = 'HC-' + Math.random().toString(36).substring(2, 12).toUpperCase();", "hash = 'OV-' + Math.random().toString(36).substring(2, 12).toUpperCase();")
          s = s.replace("localStorage.getItem('hc-node-hash')", "localStorage.getItem('ovsite-node-id') || localStorage.getItem('hc-node-hash')")
          s = s.replace("localStorage.setItem('hc-node-hash', hash);", "localStorage.setItem('ovsite-node-id', hash);")
          p.write_text(s)

          for name in ['src/pages/AdminPage.tsx', 'src/pages/SettingsPage.tsx']:
              q = Path(name)
              t = q.read_text().replace('care-ops-backup-', 'ovsite-backup-')
              q.write_text(t)

          # Remove this one-time workflow in the same commit.
          Path('.github/workflows/one-time-settings-security-cleanup.yml').unlink()
          PY

      - name: Verify no embedded vault PIN remains
        run: |
          ! grep -R "236693" src
          ! grep -R "care-ops-backup-" src

      - name: Commit cleanup
        run: |
          git config user.name "OVSITE Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "security: remove false client-side vault controls"
          git push origin HEAD:chore/ovsite-production-hardening

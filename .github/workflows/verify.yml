name: OVSITE Verify

on:
  push:
    branches:
      - master
      - 'chore/**'
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: identity-lint-test-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Runtime identity audit
        run: npm run audit:identity

      - name: Lint
        run: npm run lint

      - name: Deterministic test suite
        # import-stress-report.test.ts intentionally depends on a private local
        # care corpus that is never committed. It remains a workstation stress
        # test; CI runs every deterministic repository-contained test.
        run: npm test -- --exclude src/lib/import-stress-report.test.ts

      - name: Production build
        run: npm run build

      - name: Dependency security audit
        run: npm audit --audit-level=high

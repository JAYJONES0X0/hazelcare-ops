name: OVSITE Verify

on:
  push:
    branches:
      - master
      - 'chore/**'
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

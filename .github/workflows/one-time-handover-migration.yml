name: OVSITE One-Time Handover Migration

on:
  push:
    branches:
      - chore/ovsite-production-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: apply handover migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/ovsite-production-hardening

      - name: Migrate live handover storage namespace
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/HandoverPage.tsx')
          s = p.read_text()
          old = """const STORAGE_KEY = 'careops-handovers';

function loadHandovers(): Handover[] {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}
"""
          new = """const STORAGE_KEY = 'ovsite-handovers-v1';
const LEGACY_STORAGE_KEY = 'careops-handovers';

function loadHandovers(): Handover[] {
  try {
    const current = localStorage.getItem(STORAGE_KEY);
    if (current) return JSON.parse(current);
    const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
    if (legacy) {
      localStorage.setItem(STORAGE_KEY, legacy);
      return JSON.parse(legacy);
    }
    return [];
  } catch { return []; }
}
"""
          if old not in s:
            if "const STORAGE_KEY = 'ovsite-handovers-v1';" in s:
              raise SystemExit(0)
            raise SystemExit('Expected handover storage block not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/one-time-handover-migration.yml

      - name: Commit migration
        run: |
          git config user.name "OVSITE Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: migrate handover storage to OVSITE namespace"
          git push origin HEAD:chore/ovsite-production-hardening

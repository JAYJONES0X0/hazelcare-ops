name: OVSITE One-Time Live Identity Cleanup

on:
  push:
    branches:
      - chore/ovsite-production-hardening

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/ovsite-production-hardening

      - name: Apply exact live-surface migrations
        shell: python
        run: |
          from pathlib import Path

          settings = Path('src/pages/SettingsPage.tsx')
          text = settings.read_text()
          text = text.replace(
              "if (newPass.length < 8) { setResult({ ok: false, msg: 'New password must be at least 8 characters.' }); return; }",
              "if (newPass.length < 12) { setResult({ ok: false, msg: 'New password must be at least 12 characters.' }); return; }",
          )
          text = text.replace(
              "setResult({ ok: true, msg: 'Password updated successfully.' });\n        setCurrent(''); setNewPass(''); setConfirm('');",
              "setResult({ ok: true, msg: 'Password changed. Signing you out…' });\n        setCurrent(''); setNewPass(''); setConfirm('');\n        setTimeout(onSignOut, 600);",
          )
          text = text.replace('`care-ops-backup-${new Date().toISOString().slice(0, 10)}.json`', '`ovsite-backup-${new Date().toISOString().slice(0, 10)}.json`')
          settings.write_text(text)

          admin = Path('src/pages/AdminPage.tsx')
          text = admin.read_text().replace('`care-ops-backup-${new Date().toISOString().slice(0, 10)}.json`', '`ovsite-backup-${new Date().toISOString().slice(0, 10)}.json`')
          admin.write_text(text)

          handover = Path('src/pages/HandoverPage.tsx')
          text = handover.read_text()
          old = """const STORAGE_KEY = 'careops-handovers';

function loadHandovers(): Handover[] {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}
"""
          new = """const STORAGE_KEY = 'ovsite-handovers-v1';
const LEGACY_STORAGE_KEY = 'careops-handovers';

function loadHandovers(): Handover[] {
  try {
    const current = localStorage.getItem(STORAGE_KEY);
    if (current) return JSON.parse(current);
    const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
    if (legacy) {
      localStorage.setItem(STORAGE_KEY, legacy);
      return JSON.parse(legacy);
    }
    return [];
  } catch { return []; }
}
"""
          if old not in text:
              raise SystemExit('Handover storage block did not match expected source')
          handover.write_text(text.replace(old, new))

      - name: Remove this one-time workflow
        run: git rm .github/workflows/one-time-live-identity-cleanup.yml

      - name: Commit scoped cleanup
        run: |
          git config user.name "OVSITE Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/SettingsPage.tsx src/pages/AdminPage.tsx src/pages/HandoverPage.tsx .github/workflows/one-time-live-identity-cleanup.yml
          git commit -m "fix: align live OVSITE settings and storage identity"
          git push origin HEAD:chore/ovsite-production-hardening

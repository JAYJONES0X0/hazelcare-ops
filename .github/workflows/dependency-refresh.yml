name: OVSITE Dependency Refresh

on:
  push:
    branches:
      - chore/ovsite-production-hardening

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/ovsite-production-hardening

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve patched transitive dependencies
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Confirm high severity audit is clean
        run: npm audit --audit-level=high

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: patch vulnerable transitive dependencies"
          git push origin HEAD:chore/ovsite-production-hardening

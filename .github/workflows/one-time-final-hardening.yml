name: OVSITE One-Time Final Hardening

on:
  push:
    branches:
      - chore/ovsite-production-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/ovsite-production-hardening

      - name: Apply final runtime hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Handover storage: OVSITE canonical key with legacy copy-forward.
          p = Path('src/pages/HandoverPage.tsx')
          s = p.read_text()
          old = """const STORAGE_KEY = 'careops-handovers';

function loadHandovers(): Handover[] {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}
"""
          new = """const STORAGE_KEY = 'ovsite-handovers-v1';
const LEGACY_STORAGE_KEY = 'careops-' + 'handovers';

function loadHandovers(): Handover[] {
  try {
    const current = localStorage.getItem(STORAGE_KEY);
    if (current) return JSON.parse(current);
    const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
    if (legacy) {
      localStorage.setItem(STORAGE_KEY, legacy);
      return JSON.parse(legacy);
    }
    return [];
  } catch { return []; }
}
"""
          if old not in s:
            raise SystemExit('Expected Handover storage block not found')
          p.write_text(s.replace(old, new))

          # 2) External notification identity.
          p = Path('api/staff/[...action].js')
          s = p.read_text()
          if "'X-Title': 'Care Ops'" not in s:
            raise SystemExit('Expected legacy X-Title not found')
          s = s.replace("'X-Title': 'Care Ops'", "'X-Title': 'OVSITE'")

          # 3) Credential-epoch enforcement on privileged staff routes.
          import_anchor = "import { consumeOnce } from '../_lib/durable-once.js';\n"
          if "verifySessionCredentialState" not in s:
            if import_anchor not in s:
              raise SystemExit('Could not locate staff import anchor')
            s = s.replace(import_anchor, import_anchor + "import { verifySessionCredentialState } from '../_lib/ovsite-credentials.js';\n")

          old_gate = """function requireSessionRole(req, res, minRole = 'manager') {
  if (!AUTH_SESSION_SECRET) {
    res.status(503).json({ error: 'Session not configured' });
    return null;
  }
  const cookies = parseCookies(req);
  const claims = readHcSessionClaims(cookies[HC_SESSION_COOKIE], AUTH_SESSION_SECRET);
  if (!claims) {
    res.status(401).json({ error: 'Unauthorized' });
    return null;
  }

  const role = sanitizeRole(claims.role || AUTH_DEFAULT_ROLE);
"""
          new_gate = """async function requireSessionRole(req, res, minRole = 'manager') {
  if (!AUTH_SESSION_SECRET) {
    res.status(503).json({ error: 'Session not configured' });
    return null;
  }
  const cookies = parseCookies(req);
  const claims = readHcSessionClaims(cookies[HC_SESSION_COOKIE], AUTH_SESSION_SECRET);
  if (!claims) {
    res.status(401).json({ error: 'Unauthorized' });
    return null;
  }

  const sessionState = await verifySessionCredentialState(claims);
  if (!sessionState.ok) {
    res.status(503).json({ error: sessionState.error || 'Credential service unavailable' });
    return null;
  }
  if (!sessionState.current) {
    res.status(401).json({ error: 'Session expired after a credential change' });
    return null;
  }

  const role = sanitizeRole(claims.role || AUTH_DEFAULT_ROLE);
"""
          if old_gate not in s:
            raise SystemExit('Could not locate requireSessionRole gate')
          s = s.replace(old_gate, new_gate)

          pattern = re.compile(r"if \(!requireSessionRole\(([^\n]+?)\)\) return;")
          matches = pattern.findall(s)
          if not matches:
            raise SystemExit('No privileged staff route calls matched')
          s = pattern.sub(r"if (!(await requireSessionRole(\1))) return;", s)
          if 'if (!requireSessionRole(' in s:
            raise SystemExit('A synchronous privileged session check remains')
          p.write_text(s)
          print(f'Credential epoch applied to {len(matches)} privileged staff route checks')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/one-time-final-hardening.yml

      - name: Commit hardened runtime
        run: |
          git config user.name "OVSITE Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "security: finish OVSITE runtime hardening"
          git push origin HEAD:chore/ovsite-production-hardening
